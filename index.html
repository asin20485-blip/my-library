<!DOCTYPE html>
<html>
<head>
    <title>Library Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3a8a, #2563eb, #06b6d4);
        }

        .container {
            width: 900px;
            display: flex;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .left {
            width: 50%;
            padding: 50px;
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .left p {
            font-size: 17px;
            line-height: 1.6;
        }

        .book-icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        .right {
            width: 50%;
            padding: 50px;
        }

        .right h2 {
            color: #1e3a8a;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .right p {
            color: #777;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1e3a8a;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #999;
        }

        @media (max-width: 700px) {
            .container {
                width: 90%;
                flex-direction: column;
            }

            .left,
            .right {
                width: 100%;
            }

            .left {
                padding: 30px;
            }

            .right {
                padding: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="left">
            <div class="book-icon">📚</div>

            <h1>Library Management System</h1>

            <p>
                Manage books, members, issue and return records
                easily through a simple digital system.
            </p>
        </div>

        <div class="right">

            <h2>Welcome Back!</h2>

            <p>Login to access the library dashboard.</p>

            <form onsubmit="event.preventDefault(); login();">

                <div>

    <input
        type="text"
        id="username"
        placeholder="Enter Username"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="Enter Password"
        required
    >

    <button type="button" onclick="login()">
        Login
    </button>

</div>

  <script>
function login() {

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if (username === "admin" && password === "1234") {
        window.location.href = "dashboard.html";
    } else {
        alert("Invalid Username or Password");
    }
}
</script>  
    

</body>
</html>
